[tool.poetry]
name = "oracle-mistakes"
description = ""
authors = ["Ran Schreiber <ransch7@gmail.com>"]
version = "0.1.0"
packages = [{include = "oracle_mistakes"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
ortools = "~9"
# pyzmq is an indirect dependency, and is specified because lower versions cannot be installed.
pyzmq = "^25.1.2"
# pickleshare prevents a warning in the Jupyter notebook.
pickleshare = "^0.7.5"

[tool.poetry.group.dev.dependencies]
jupyterlab = "~4"
pytest = "~8"
pytest-mock = "~3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
